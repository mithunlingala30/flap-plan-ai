name: flapplan_ai
description: FlapPlanAI - Periodontal surgery outcome prediction (Flutter port).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3

  # State management
  provider: ^6.1.2

  # Networking
  http: ^1.2.2

  # UI / utils
  google_fonts: ^6.2.1
  intl: ^0.19.0
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # If you add custom fonts/images later, register them here.
